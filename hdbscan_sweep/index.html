<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HDBSCAN Sweep</title>
<style>
/* ── tokens ── */
:root{
  --bg:#eef2f5;--panel:#fff;--panel-2:#f4f7fa;--line:#ccd8e0;--line-soft:#e2eaef;
  --ink:#0d1b24;--ink-2:#3d545f;--ink-3:#6b8391;
  --accent:#0f7f95;--accent-soft:#d7edf2;--accent-ink:#0a5a6a;
  --good:#2f7d5c;--good-soft:#dcefe5;
  --warn:#9c6410;--warn-soft:#f6e9d2;
  --bad:#a63c31;--bad-soft:#f6dedb;
  --grid:#dde7ed;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0a1219;--panel:#111d26;--panel-2:#16242e;--line:#253944;--line-soft:#1c2d37;
  --ink:#e6eef2;--ink-2:#a7bcc6;--ink-3:#7691a0;
  --accent:#3fb6ce;--accent-soft:#123039;--accent-ink:#8ad6e6;
  --good:#5cbf93;--good-soft:#102c22;
  --warn:#d9a04a;--warn-soft:#2e2412;
  --bad:#e0796b;--bad-soft:#301a17;
  --grid:#1e2f39;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font:13px/1.5 ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased}
.sans{font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif}

/* ── page 1 ── */
#pg-select{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.pg1-header{
  flex:none;padding:18px 24px 14px;border-bottom:1px solid var(--line);
  background:var(--panel);display:flex;align-items:baseline;gap:16px;flex-wrap:wrap
}
.pg1-title{font-size:20px;font-weight:650;letter-spacing:-.02em}
.pg1-sub{font-size:12px;color:var(--ink-3)}
.pg1-legend{
  margin-left:auto;display:flex;gap:10px;align-items:center;font-size:11px;color:var(--ink-3)
}
.leg-dot{width:12px;height:12px;border-radius:2px;flex:none}
.pg1-scroll{flex:1;overflow:auto}
#sel-tbl{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums;min-width:900px}
#sel-tbl th{
  position:sticky;top:0;z-index:2;background:var(--panel-2);
  padding:8px 11px;text-align:right;white-space:nowrap;
  font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;border-bottom:2px solid var(--line);cursor:default
}
#sel-tbl th:first-child{text-align:left;position:sticky;left:0;z-index:3;border-right:1px solid var(--line)}
#sel-tbl td{padding:7px 11px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line-soft)}
#sel-tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1;border-right:1px solid var(--line);font-weight:500}
#sel-tbl tbody tr{cursor:pointer}
#sel-tbl tbody tr:hover td{opacity:.85;outline:1px solid var(--accent);outline-offset:-1px}
#sel-tbl tbody tr:hover td:first-child{background:var(--accent-soft);color:var(--accent-ink)}
#sel-tbl tbody tr.rec .mlabel::before{content:"★ ";color:var(--warn)}
.selchk{
  margin-right:8px;vertical-align:middle;cursor:pointer;
  width:14px;height:14px;accent-color:var(--accent)
}
#sel-tbl tbody tr.picked td{box-shadow:inset 0 0 0 9999px rgba(15,127,149,.10)}
#sel-tbl tbody tr.picked td:first-child{
  background:var(--accent-soft);color:var(--accent-ink);font-weight:650
}

/* ── compare bar ── */
.cmp-bar{
  flex:none;display:none;align-items:center;gap:14px;
  padding:11px 24px;border-top:1px solid var(--line);
  background:var(--panel);box-shadow:0 -3px 14px -8px rgba(0,0,0,.28)
}
.cmp-bar.on{display:flex}
.cmp-count{font-size:12.5px;color:var(--ink-2)}
.cmp-count b{color:var(--accent);font-size:14px}
.cmp-names{
  flex:1;min-width:0;font-size:11px;color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.btn{
  font:inherit;font-size:12.5px;padding:7px 15px;border-radius:3px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2)
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.1);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--line);color:var(--ink-3)}
.na-cell{color:var(--ink-3);font-style:italic}
.group-hdr td{
  background:var(--panel-2)!important;padding:6px 11px;
  font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;border-top:2px solid var(--line);border-bottom:1px solid var(--line)
}

/* ── page 2 ── */
#pg-detail{height:100vh;display:none;flex-direction:column;overflow:hidden}
.pg2-topbar{
  flex:none;padding:10px 18px;border-bottom:1px solid var(--line);
  background:var(--panel);display:flex;align-items:center;gap:14px
}
#back-btn{
  font:inherit;font-size:12.5px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:3px;padding:6px 13px;cursor:pointer;color:var(--ink-2)
}
#back-btn:hover{border-color:var(--accent);color:var(--accent)}
.pg2-label{font-size:14px;font-weight:650;letter-spacing:-.01em}
.pg2-sublabel{font-size:11px;color:var(--ink-3);margin-top:2px}
.m-badge{
  display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:2px;
  background:var(--warn-soft);color:var(--warn);font-weight:700;margin-left:8px;vertical-align:middle
}
.pg2-body{flex:1;overflow:hidden;display:grid;grid-template-columns:280px 1fr}

/* metrics panel */
.metrics-col{overflow-y:auto;border-right:1px solid var(--line);background:var(--panel);padding:16px 18px}
.m-section{margin-bottom:20px}
.m-section-title{
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  font-weight:700;margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid var(--line-soft)
}
.m-row{
  display:flex;justify-content:space-between;align-items:baseline;
  gap:8px;padding:5px 0;border-bottom:1px solid var(--line-soft)
}
.m-row:last-child{border-bottom:0}
.m-key{font-size:11.5px;color:var(--ink-3)}
.m-val{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.m-val.good{color:var(--good)}
.m-val.bad{color:var(--bad)}
.m-val.na{color:var(--ink-3);font-weight:400;font-style:italic}

/* image panel */
.img-col{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.img-tabs{flex:none;display:flex;border-bottom:1px solid var(--line);background:var(--panel-2)}
.itab,.ctab{
  flex:none;padding:11px 22px;border:0;font:inherit;font-size:12.5px;cursor:pointer;
  background:transparent;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;
  border-bottom:2px solid transparent;transition:color .1s
}
.itab[aria-selected="true"],.ctab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);background:var(--panel)}
.itab:hover:not([aria-selected="true"]),.ctab:hover:not([aria-selected="true"]){color:var(--ink);background:var(--accent-soft)}
#pg-compare .img-tabs{flex:none;display:flex;border-bottom:1px solid var(--line);background:var(--panel-2)}
.img-main{flex:1;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.img-zoom-wrap{width:100%;height:100%;overflow:auto;display:flex;align-items:flex-start;justify-content:flex-start;cursor:grab;padding:12px}
.img-zoom-wrap:active{cursor:grabbing}
#detail-img{display:block;user-select:none}
.img-cap{
  flex:none;padding:8px 16px;font-size:11.5px;color:var(--ink-3);
  border-top:1px solid var(--line-soft);background:var(--panel-2);min-height:32px
}

/* atlas panel */
#atlas-panel{display:none;flex-direction:column;overflow:hidden;background:var(--bg)}

/* feature drill-down (full height) */
.atlas-feat-section{
  flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0
}
/* two-column chip selector */
.atlas-feat-cols{
  flex:none;display:grid;grid-template-columns:1fr 1fr;
  border-bottom:1px solid var(--line);max-height:160px;overflow-y:auto
}
.atlas-feat-col{
  display:flex;flex-direction:column;overflow:hidden;
  border-right:1px solid var(--line-soft)
}
.atlas-feat-col:last-child{border-right:0}
.atlas-col-hdr{
  position:sticky;top:0;z-index:1;
  padding:5px 10px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--accent);font-weight:700;background:var(--panel-2);
  border-bottom:1px solid var(--line-soft)
}
.atlas-col-chips{padding:6px 8px;display:flex;flex-wrap:wrap;gap:3px}
.achip-sep{
  width:100%;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);padding:4px 2px 2px;margin-top:2px
}
.achip{
  font:inherit;font-size:11px;padding:3px 8px;border-radius:2px;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap
}
.achip:hover{border-color:var(--accent);color:var(--accent)}
.achip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.atlas-feat-main{
  flex:1;overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center
}
.atlas-zoom-wrap{
  width:100%;height:100%;overflow:auto;display:flex;
  align-items:flex-start;justify-content:flex-start;cursor:grab;padding:12px
}
.atlas-zoom-wrap:active{cursor:grabbing}
#atlas-img{display:block;user-select:none}
.zoom-bar{
  position:absolute;bottom:10px;right:12px;
  display:flex;gap:4px;z-index:5
}
.zbtn{
  font:inherit;font-size:13px;font-weight:700;
  width:30px;height:30px;border-radius:3px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink-2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:1
}
.zbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.atlas-cap{
  flex:none;padding:7px 14px;font-size:11px;color:var(--ink-3);
  border-top:1px solid var(--line-soft);background:var(--panel-2);min-height:28px
}

/* ── compare page ── */
#pg-compare{height:100vh;display:none;flex-direction:column;overflow:hidden}
.cmp-grid{
  flex:1;overflow-y:auto;padding:14px;
  display:grid;gap:12px;align-content:start;
  grid-template-columns:repeat(auto-fit,minmax(340px,1fr))
}
.cmp-panel{
  border:1px solid var(--line);border-radius:3px;background:var(--panel);
  display:flex;flex-direction:column;overflow:hidden
}
.cmp-panel.rec{border-color:var(--warn)}
.cmp-panel-hdr{
  flex:none;padding:8px 12px;background:var(--panel-2);
  border-bottom:1px solid var(--line-soft);
  display:flex;justify-content:space-between;align-items:baseline;gap:10px
}
.cmp-panel-t{font-size:12px;font-weight:650}
.cmp-panel-s{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.cmp-panel-img{
  padding:8px;cursor:zoom-in;background:var(--bg);
  display:flex;align-items:center;justify-content:center
}
.cmp-panel-img img{max-width:100%;height:auto;display:block}

/* ── fullscreen modal ── */
#modal{
  position:fixed;inset:0;z-index:100;display:none;
  background:rgba(6,14,20,.93);flex-direction:column
}
#modal.on{display:flex}
.modal-bar{
  flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px;
  background:rgba(0,0,0,.35);color:#e6eef2
}
.modal-title{font-size:13px;font-weight:650;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-bar .zbtn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#e6eef2}
.modal-bar .zbtn:hover{background:rgba(255,255,255,.22);color:#fff;border-color:#fff}
.modal-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;
  padding:12px;cursor:grab}
.modal-body:active{cursor:grabbing}
#modal-img{display:block;user-select:none}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</div>

<div id="modal">

    <button class="zbtn" id="modal-close" title="Close (Esc)">✕</button>
  </div>
  <div class="modal-body" id="modal-body"><img id="modal-img" src="" alt=""></div>
</div>

<!-- PAGE 2 -->
<div id="pg-detail">
  <div class="pg2-topbar">
    <button id="back-btn" type="button">← All models</button>
    <div>
      <div class="pg2-label sans" id="detail-label"></div>
      <div class="pg2-sublabel" id="detail-sublabel"></div>
    </div>
  </div>
  <div class="pg2-body">
    <div class="metrics-col" id="metrics-col"></div>
    <div class="img-col" id="img-col">
      <div class="img-tabs">
        <button class="itab" aria-selected="true"  data-itab="subst">Substitution</button>
        <button class="itab" aria-selected="false" data-itab="sigp">UMAP + SigProfiler</button>
        <button class="itab" aria-selected="false" data-itab="cosine">Cosine Similarity</button>
        <button class="itab" aria-selected="false" data-itab="cluster">Clusters</button>
        <button class="itab" aria-selected="false" data-itab="atlas">Feature Atlas</button>
      </div>
      <div class="img-main">
        <div class="img-zoom-wrap" id="cell-zoom-wrap"><img id="detail-img" src="" alt=""></div>
        <div class="zoom-bar">
          <button class="zbtn" id="cell-zoom-in"  title="Zoom in">+</button>
          <button class="zbtn" id="cell-zoom-out" title="Zoom out">−</button>
          <button class="zbtn" id="cell-zoom-rst" title="Reset zoom" style="font-size:11px">⊙</button>
        </div>
      </div>
      <div class="img-cap" id="img-cap"></div>
    </div>
    <div id="atlas-panel">
      <div class="img-tabs" style="border-bottom:1px solid var(--line)">
        <button class="itab" aria-selected="false" data-itab="subst">Substitution</button>
        <button class="itab" aria-selected="false" data-itab="sigp">UMAP + SigProfiler</button>
        <button class="itab" aria-selected="false" data-itab="cosine">Cosine Similarity</button>
        <button class="itab" aria-selected="false" data-itab="cluster">Clusters</button>
        <button class="itab" aria-selected="true"  data-itab="atlas">Feature Atlas</button>
      </div>
      <div class="atlas-feat-section">
        <div class="atlas-feat-cols">
          <div class="atlas-feat-col">
            <div class="atlas-col-hdr">Categorical</div>
            <div class="atlas-col-chips" id="atlas-cat-chips"></div>
          </div>
          <div class="atlas-feat-col">
            <div class="atlas-col-hdr">Numeric</div>
            <div class="atlas-col-chips" id="atlas-num-chips"></div>
          </div>
        </div>
        <div class="atlas-feat-main">
          <div class="atlas-zoom-wrap" id="atlas-zoom-wrap">
            <img id="atlas-img" src="" alt="" style="display:none">
          </div>
          <div class="zoom-bar">
            <button class="zbtn" id="atlas-zoom-in"  title="Zoom in">+</button>
            <button class="zbtn" id="atlas-zoom-out" title="Zoom out">−</button>
            <button class="zbtn" id="atlas-zoom-rst" title="Reset zoom" style="font-size:11px">⊙</button>
          </div>
        </div>
        <div class="atlas-cap" id="atlas-cap">Select a feature above to view its UMAP</div>
      </div>
    </div>
  </div>
</div>

el": "Cell identifier: fit{rows}_mcs{min_cluster_size}_ms{min_samples}_eom", "fit_rows": "Number of UMAP points used to fit HDBSCAN (subsample of full 157.5M cohort)", "mcs": "min_cluster_size: minimum points for a group to be considered a cluster", "ms": "min_samples: controls conservatism; higher = more noise, fewer clusters", "n_clusters": "Number of clusters found by HDBSCAN (excludes noise)", "noise_pct": "Fraction of cohort reads assigned to cluster \u22121 (noise), expressed as %", "dbcv": "Density-Based Cluster Validity, computed with the kdbcv backend on a stratified sample. Higher = better separated clusters. NEARLY DETERMINED BY n_clusters (rho=-0.966) - not an independent quality score. BACKEND MATTERS: the deployed model's own metrics.json reports DBCV 0.4074 for fit1000000_mcs2500_ms15_eom because it is measured with the hdbscan backend over 70,000 stratified rows. This table reports 0.4313 from kdbcv. Same clustering, two estimators - the values are not interchangeable, and only the kdbcv column is comparable across the cells here.", "relative_validity": "CPU-only. Direct model attribute: model.relative_validity_ after hdbscan.HDBSCAN().fit(X). Computed internally during condensed-tree traversal \u2014 a faster DBCV approximation reusing the already-built tree. cuML defines the attribute but never populates it (stays NaN after fit). Range 0.197-0.346 across 24 CPU cells (1.76x spread vs DBCV 302x). Sanity check, not a discriminator.", "neg_cluster_frac": "CPU-only. Fraction of clusters with negative DBCV score. Higher = more poorly-separated clusters.", "neg_point_share": "CPU-only. Fraction of assigned (non-noise) points that belong to a cluster with negative DBCV. More interpretable than raw DBCV. \u03c1=\u22120.977 with DBCV.", "connect": "Connectivity: fraction of cluster pairs where nearest-neighbour connections are pure (k=10). Near 1.0 for all cells \u2014 uninformative for ranking on this grid.", "prob_mean": "Mean cluster membership probability (HDBSCAN soft clustering). Higher = more confident assignments.", "prob>0.8": "Fraction of assigned points with membership probability > 0.8.", "persist": "Median cluster persistence. DEGENERATE: exactly 1.0 for all clusters in 22/24 cells (\u2265175 clusters). Do not use to rank cells. Real distribution only for 88/89-cluster cells.", "persist_min": "CPU-only. Minimum cluster persistence across all clusters. 0.003\u20130.010 for 88/89-cluster cells; 1.0000 for all others.", "persist_max": "CPU-only. Maximum cluster persistence. 0.937\u20130.925 for 88/89-cluster cells; 1.0000 for all others.", "persist_frac_one": "CPU-only. Fraction of clusters where persistence \u2265 0.999. 1.0 for degenerate cells, 0.0 for the two well-behaved cells.", "cos_mean": "Unweighted mean cosine similarity between each cluster's raw SBS96 profile and its SigProfilerAssignment reconstruction from uv_only signatures. Formula: mean(cosine[c] for c in clusters). Every cluster counts equally regardless of size. Range 0.130\u20130.250 on this grid. 1.0 = perfect reconstruction; 0.0 = orthogonal (completely wrong shape). Low values indicate cohort mutation spectra fall outside the uv_only reference space.", "cos_wmean": "Mutation-count-weighted cosine similarity. Formula: sum(cosine[c] * n_mutations[c]) / total_mutations. Large clusters (many reads) dominate. cos_wmean < cos_mean means big clusters fit uv_only worse than small ones; cos_wmean > cos_mean means big clusters fit better. On this grid both are 0.13\u20130.27 with wmean often slightly above mean, because the largest clusters tend to be highly peaked (one dominant channel) which is easier to match.", "mut%>0.8": "Percentage of total cohort mutations that live in clusters where cosine similarity > 0.8. Formula: (sum(n_mutations[c] for c if cosine[c] > 0.8) / total_mutations) * 100. The column name contains a literal % \u2014 values are in percent units, NOT a fraction. CAN EXCEED 1 (e.g., 2.6 means 2.6% of mutations). Range on this grid: 0.0\u20132.6%. Meaning: only 0-3% of reads are in clusters SigProfiler can reconstruct with cosine > 0.8 from uv_only. The other 97-100% of reads are in clusters that fit uv_only poorly.", "top_chan": "Median top-channel share, computed directly from raw SBS96 counts (NOT from SigProfiler reconstruction). Per cluster: max(SBS96_counts[c]) / sum(SBS96_counts[c]) = fraction of that cluster's mutations in its single most common trinucleotide context (e.g. 'A[T>G]G'). The reported value is the MEDIAN of this fraction across all clusters. 0.57 = typical cluster has 57% of its mutations in one trinucleotide channel. 0.92 = typical cluster is almost entirely one context \u2014 extremely peaked. This is high on this grid (0.55-0.92) because HDBSCAN is grouping reads by trinucleotide context, which is a dominant axis in the VAE latent space.", "tc>0.5": "Fraction of clusters where top_channel_share > 0.5 (more than half of reads in a single trinucleotide channel). Formula: count(clusters where max(SBS96[c])/sum(SBS96[c]) > 0.5) / n_clusters. Also computed from raw SBS96 counts, not SigProfiler. 0.63 = 63% of clusters are single-channel-dominated. Complements top_chan median: tells you how many clusters are peaked, not just the typical one. On this grid: 0.61-0.88, meaning the majority of clusters in every cell are single-channel dominated.", "l1%_mean": "Mean L1 residual expressed as % of cluster mutation count. Per cluster: sum(|observed[c,j] - reconstructed[c,j]| for j in 96 channels) / n_mutations[c] * 100. EXCEEDS 100% because uv_only overshoots some channels while undershooting others \u2014 the absolute errors from all channels that are wrong in either direction sum to more than the total count. 168\u2013177% on this grid means the reconstruction has roughly 1.7x the total mutation count worth of absolute error \u2014 the wrong shape is being fitted in both positive and negative directions simultaneously.", "l2%_mean": "Mean L2 (Euclidean) residual as % of cluster mutation count. sqrt(sum((observed[c,j]-reconstructed[c,j])^2)) / n_mutations[c] * 100. Same interpretation as L1% \u2014 can exceed 100% for the same reason. L2 penalises large per-channel errors more than L1.", "outlier_p50": "CPU-only. Median outlier score. Points deep inside clusters score near 0; points near cluster boundaries score higher; noise points score 1.", "outlier_p99": "CPU-only. 99th-percentile outlier score. < 1.0 only for 88/89-cluster cells (0.979, 0.950). Exactly 1.0 for all other cells \u2014 in high-granularity solutions most points are treated as extreme outliers.", "fit_s": "Seconds to run HDBSCAN fit. NOT a valid backend benchmark \u2014 dominated by shared data-loading overhead. cuML and CPU give nearly identical times.", "label_s": "Seconds to apply cluster labels to the full 157.5M-row cohort (RBC approximate nearest-centroid). CPU is 7.9% faster than cuML overall."}};

// image path helpers — no base64, just relative paths served by Python
function imgPath(type, label) {
  if (type === "subst")   return "images/substitution/" + label + "_substitution.png";
  if (type === "sigp")    return "images/sigprofiler/"  + label + "_sigprofiler.png";
  if (type === "cosine")  return "images/cosine/"       + label + "_cosine.png";
  if (type === "cluster") return "images/cluster/"      + label + "_cluster.png";
}
function atlasPath(key) {
  if (key.startsWith("contact_sheet_"))
    return "images/atlas/" + key + ".png";
  return "images/atlas/umap_" + key + ".png";
}

// ── colour scale ────────────────────────────────────────────────────────────
const COL_RANGE = {};
COL_DEFS.forEach(col => {
  const vals = DATA.cells.map(c => c[col.k]).filter(v => v !== null && v !== undefined);
  COL_RANGE[col.k] = {mn: Math.min(...vals), mx: Math.max(...vals)};
});

function normVal(k, v) {
  if (v === null || v === undefined) return null;
  const {mn, mx} = COL_RANGE[k];
  if (mx === mn) return 0.5;
  const t = (v - mn) / (mx - mn);
  const def = COL_DEFS.find(c => c.k === k);
  return def.dir === -1 ? 1 - t : def.dir === 1 ? t : null;
}

function cellBg(t) {
  if (t === null) return "";
  const dark = document.documentElement.dataset.theme === "dark" ||
    (!document.documentElement.dataset.theme && window.matchMedia("(prefers-color-scheme:dark)").matches);
  const bad  = dark ? [122,31,26]  : [245,165,158];
  const mid  = dark ? [22, 36, 46] : [240,244,246];
  const good = dark ? [26,102,68]  : [126,207,160];
  let r, g, b;
  if (t <= 0.5) {
    const s = t * 2;
    r = bad[0]+(mid[0]-bad[0])*s; g = bad[1]+(mid[1]-bad[1])*s; b = bad[2]+(mid[2]-bad[2])*s;
  } else {
    const s = (t - 0.5) * 2;
    r = mid[0]+(good[0]-mid[0])*s; g = mid[1]+(good[1]-mid[1])*s; b = mid[2]+(good[2]-mid[2])*s;
  }
  return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}

  let html = "";
  FIT_ORDER.forEach(fit => {
    const group = DATA.cells.filter(c => c.fit_rows === fit);
    html += `<tr class="group-hdr"><td colspan="${COL_DEFS.length+1}">${FIT_LABEL[fit]}</td></tr>`;
    group.forEach(cell => {
      const isRec = RECOMMENDED.has(cell.label);
      const short = `mcs ${cell.mcs} / ms ${cell.ms}`;
      html += `<tr data-l="${cell.label}" class="${isRec?"rec":""}">`
            + `<td><input type="checkbox" class="selchk" data-l="${cell.label}">`
            + `<span class="mlabel">${short}</span></td>`;
      COL_DEFS.forEach(col => {
        const v = col.k === "rel_validity"  ? (cell.cpu ? cell.cpu.rel_validity : null)
                : col.k === "neg_dbcv_frac" ? (cell.cpu ? cell.cpu.frac_pts_neg_dbcv : null)
                : cell[col.k];
        const t = normVal(col.k, v);
        const bg = cellBg(t);
        const txt = v === null ? `<span class="na-cell">—</span>` : v.toFixed(col.dp);
        html += `<td style="${bg ? "background:"+bg : ""}">${txt}</td>`;
      });
      html += "</tr>";
    });
  });
  document.getElementById("sel-tbody").innerHTML = html;
}

// ── page 2 ─────────────────────────────────────────────────────────────────

// ── zoom logic ──────────────────────────────────────────────────────────────
// Resizes the img element so overflow:auto can scroll to any region.
// Zoom is always centred on the viewport centre point.
const PAD = 12;

function makeZoom(imgId, wrapId, zoomInId, zoomOutId, zoomRstId) {
  let z = 1;
  const img  = () => document.getElementById(imgId);
  const wrap = () => document.getElementById(wrapId);

  // Fit size at z=1: scale natural image to fill the container (object-fit:contain)
  function fitPx() {
    const el = img(), wr = wrap();
    const iw = el.naturalWidth, ih = el.naturalHeight;
    if (!iw || !ih) return null;
    const s = Math.min((wr.clientWidth - PAD*2) / iw, (wr.clientHeight - PAD*2) / ih);
    return { w: iw * s, h: ih * s };
  }

  // Apply a new zoom level, keeping the viewport centre fixed in image coords.
  function applyZoom(newZ) {
    const dims = fitPx(); if (!dims) return;
    const wr = wrap(), el = img();
    const wrapW = wr.clientWidth, wrapH = wr.clientHeight;

    // --- record where the viewport centre sits in the image before zoom ---
    const oldW = dims.w * z, oldH = dims.h * z;
    const wasSmall = oldW <= wrapW - PAD*2 && oldH <= wrapH - PAD*2;
    // Image top-left in viewport coordinates
    const imgVL = wasSmall ? (wrapW - oldW) / 2 : PAD - wr.scrollLeft;
    const imgVT = wasSmall ? (wrapH - oldH) / 2 : PAD - wr.scrollTop;
    // Fraction of image at viewport centre
    const fracX = oldW > 0 ? (wrapW/2 - imgVL) / oldW : 0.5;
    const fracY = oldH > 0 ? (wrapH/2 - imgVT) / oldH : 0.5;

    // --- apply new size ---
    z = newZ;
    const newW = dims.w * z, newH = dims.h * z;
    el.style.width = `${newW}px`; el.style.height = `${newH}px`; el.style.maxWidth = "none";

    const isSmall = newW <= wrapW - PAD*2 && newH <= wrapH - PAD*2;
    wr.style.alignItems     = isSmall ? "center" : "flex-start";
    wr.style.justifyContent = isSmall ? "center" : "flex-start";

    // --- restore viewport centre ---
    if (!isSmall) {
      // With flex-start + PAD: image left edge is at PAD in scroll space.
      // We want fracX*newW to appear at wrapW/2 → scrollLeft = PAD + fracX*newW - wrapW/2
      wr.scrollLeft = Math.max(0, PAD + fracX * newW - wrapW / 2);
      wr.scrollTop  = Math.max(0, PAD + fracY * newH - wrapH / 2);
    }
  }

  function reset() {
    const wr = wrap(); wr.scrollLeft = 0; wr.scrollTop = 0;
    wr.style.alignItems = "center"; wr.style.justifyContent = "center";
    z = 1;
    const dims = fitPx(); if (!dims) return;
    const el = img();
    el.style.width = `${dims.w}px`; el.style.height = `${dims.h}px`; el.style.maxWidth = "none";
  }

  img().addEventListener("load", reset);
  if (img().complete && img().naturalWidth) reset();

  document.getElementById(zoomInId) .addEventListener("click", () => applyZoom(Math.min(z * 1.3, 10)));
  document.getElementById(zoomOutId).addEventListener("click", () => applyZoom(Math.max(z / 1.3, 0.15)));
  document.getElementById(zoomRstId).addEventListener("click", reset);
  wrap().addEventListener("wheel", e => {
    e.preventDefault();
    applyZoom(e.deltaY < 0 ? Math.min(z * 1.12, 10) : Math.max(z / 1.12, 0.15));
  }, {passive: false});
  window.addEventListener("resize", () => { if (z === 1) reset(); });

  return { reset };
}

// ── multi-select + compare ──────────────────────────────────────────────────
const selected = new Set();
let cmpTab = "subst";

function refreshSelUI() {
  document.getElementById("cmp-n").textContent = selected.size;
  document.getElementById("cmp-bar").classList.toggle("on", selected.size > 0);
  document.getElementById("cmp-go").disabled = selected.size < 2;
  document.getElementById("cmp-go").textContent =
    selected.size < 2 ? "Select 2+ to compare" : `Compare ${selected.size} plots →`;
  document.getElementById("cmp-names").textContent =
    [...selected].map(l => l.replace(/^fit/, "").replace(/_eom$/, "")).join("   ·   ");
  document.querySelectorAll("#sel-tbl tbody tr[data-l]").forEach(tr => {
    tr.classList.toggle("picked", selected.has(tr.getAttribute("data-l")));
  });
}

function renderCompare() {
  const grid = document.getElementById("cmp-grid");
  const labels = DATA.cells.filter(c => selected.has(c.label)).map(c => c.label); // keep sweep order
  const cmpTabLabel = cmpTab==="subst"   ? "substitution profile"
    : cmpTab==="sigp"    ? "UMAP + SigProfiler"
    : cmpTab==="cosine"  ? "cosine similarity"
    : "HDBSCAN clusters";
  document.getElementById("cmp-sub").textContent = `${labels.length} models · ${cmpTabLabel}`;

  grid.innerHTML = labels.map(label => {
    const c = DATA.cells.find(x => x.label === label);
    return `<div class="cmp-panel ${RECOMMENDED.has(label) ? "rec" : ""}">
      <div class="cmp-panel-hdr">
        <span class="cmp-panel-t">${RECOMMENDED.has(label) ? "★ " : ""}fit ${fmtRows(c.fit_rows)} · mcs ${c.mcs} · ms ${c.ms}</span>
        <span class="cmp-panel-s">${c.n_clusters} cl · ${c.noise_pct.toFixed(1)}% noise</span>
      </div>
      <div class="cmp-panel-img" data-full="${imgPath(cmpTab, label)}" data-label="${label}">
        <img src="${imgPath(cmpTab, label)}" alt="${label}" loading="lazy">
      </div>
    </div>`;
  }).join("");
}

function openCompare() {
  if (selected.size < 2) return;
  document.getElementById("pg-select").style.display  = "none";
  document.getElementById("pg-detail").style.display  = "none";
  document.getElementById("pg-compare").style.display = "flex";
  renderCompare();
}

// ── fullscreen modal ────────────────────────────────────────────────────────
function openModal(src, title) {
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal").classList.add("on");
  document.getElementById("modal-img").src = src;   // set after show, so wrap has size
}
function closeModal() {
  document.getElementById("modal").classList.remove("on");
}

// ── drag-to-pan ─────────────────────────────────────────────────────────────
function addPan(wrapId) {
  const wrap = document.getElementById(wrapId);
  let down = false, ox, oy, sl, st;

  wrap.addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    down = true; ox = e.clientX; oy = e.clientY;
    sl = wrap.scrollLeft; st = wrap.scrollTop;
    wrap.style.cursor = "grabbing";
    e.preventDefault();
  });
  window.addEventListener("mousemove", e => {
    if (!down) return;
    wrap.scrollLeft = sl - (e.clientX - ox);
    wrap.scrollTop  = st - (e.clientY - oy);
  });
  window.addEventListener("mouseup", () => {
    if (!down) return;
    down = false;
    wrap.style.cursor = "grab";
  });
  // prevent browser's native image drag
  wrap.querySelector("img")?.addEventListener("dragstart", e => e.preventDefault());
}

// tab switching — unified handler for both tab bars
document.querySelectorAll(".itab").forEach(btn => {
  btn.addEventListener("click", () => {
    curTab = btn.dataset.itab;
    const isAtlas = curTab === "atlas";
    document.getElementById("img-col").style.display     = isAtlas ? "none" : "flex";
    document.getElementById("atlas-panel").style.display = isAtlas ? "flex"  : "none";
    // sync aria-selected on both tab bars
    document.querySelectorAll(`.itab[data-itab="${curTab}"]`)
      .forEach(b => b.setAttribute("aria-selected","true"));
    document.querySelectorAll(`.itab:not([data-itab="${curTab}"])`)
      .forEach(b => b.setAttribute("aria-selected","false"));
    if (!isAtlas) {
      const l = document.getElementById("pg-detail").dataset.label;
      if (l) { loadImg(l); cellZoom?.reset(); }
    }
  });
});

document.getElementById("back-btn").addEventListener("click", () => {
  document.getElementById("pg-detail").style.display = "none";
  document.getElementById("pg-select").style.display = "flex";
});

// row click — checkbox toggles selection, anywhere else opens the detail view
document.getElementById("sel-tbody").addEventListener("click", e => {
  const chk = e.target.closest(".selchk");
  if (chk) {
    const l = chk.getAttribute("data-l");
    if (chk.checked) selected.add(l); else selected.delete(l);
    refreshSelUI();
    e.stopPropagation();
    return;
  }
  const row = e.target.closest("tr[data-l]"); if (!row) return;
  curTab = "subst";
  document.getElementById("img-col").style.display    = "flex";
  document.getElementById("atlas-panel").style.display = "none";
  document.querySelectorAll('.itab[data-itab="subst"]').forEach(b => b.setAttribute("aria-selected","true"));
  document.querySelectorAll('.itab:not([data-itab="subst"])').forEach(b => b.setAttribute("aria-selected","false"));
  openDetail(row.getAttribute("data-l"));
  cellZoom?.reset();
});

buildPage1();
buildAtlasChips();
const cellZoom      = makeZoom("detail-img", "cell-zoom-wrap",  "cell-zoom-in",  "cell-zoom-out",  "cell-zoom-rst");
const atlasZoomCtrl = makeZoom("atlas-img",  "atlas-zoom-wrap", "atlas-zoom-in", "atlas-zoom-out", "atlas-zoom-rst");
addPan("cell-zoom-wrap");
addPan("atlas-zoom-wrap");
addPan("modal-body");
const modalZoom = makeZoom("modal-img", "modal-body", "modal-zin", "modal-zout", "modal-zrst");

// ── compare wiring ──────────────────────────────────────────────────────────
document.getElementById("cmp-go")   .addEventListener("click", openCompare);
document.getElementById("cmp-clear").addEventListener("click", () => {
  selected.clear();
  document.querySelectorAll(".selchk").forEach(c => { c.checked = false; });
  refreshSelUI();
});
document.getElementById("cmp-back").addEventListener("click", () => {
  document.getElementById("pg-compare").style.display = "none";
  document.getElementById("pg-select").style.display  = "flex";
});
document.querySelectorAll(".ctab").forEach(btn => {
  btn.addEventListener("click", () => {
    cmpTab = btn.dataset.ctab;
    document.querySelectorAll(".ctab").forEach(b =>
      b.setAttribute("aria-selected", b === btn ? "true" : "false"));
    renderCompare();
  });
});
// click a compare panel → fullscreen
document.getElementById("cmp-grid").addEventListener("click", e => {
  const p = e.target.closest(".cmp-panel-img"); if (!p) return;
  const modalCapLabel = cmpTab==="subst"  ? "substitution profile"
    : cmpTab==="sigp"   ? "UMAP + SigProfiler"
    : cmpTab==="cosine" ? "cosine similarity"
    : "HDBSCAN clusters";
  openModal(p.dataset.full, p.dataset.label.replace(/_eom$/, "") + " — " + modalCapLabel);
});
document.getElementById("modal-close").addEventListener("click", closeModal);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});

refreshSelUI();
